<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/poli_css.css">
</head>
<body>
    <div id="formato">
        <div>
            <div id="ca">
                <h2>ADMINISTRADOS DE GASTOS</h2>
                <p>Registra tus ingresos y gastos con claridad y estilo.</p><br>
            </div>
            <div id="pi ">
                <label for="">MONTO:</label>
                <input type="number" placeholder="EJ: 250000">
                <br>
                <label for="">FECHA:</label>
                <input type="date">
                <br>
                <label for="">CATEGORIA:</label>
                <select id=" ">
                    <option value="">SERVICIO</option>
                    <option value="">COMIDA</option>
                    <option value="">TRANSPORT</option>
                    <option value="">SALARIO</option>
                </select>
                

                <button>GUARDAR</button>
            </div>
        </div>

        <div id="history">
            <hr><br>
            <h5>MOVIMIENTOR REGISTRADOS</h5>
            <div id="tipo">
                <div id="cuafro">
                    <h4>$250.000</h4>
                    <label for="">SALIDA</label>
                </div>
                <div id="opt">
                    <button id="eso_opt">EDITAR</button>
                    <button id="eso_opt">ELIMINAR</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
